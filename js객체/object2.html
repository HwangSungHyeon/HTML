<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div>
        <input type="text" id="keyword">
    </div>
    <table>
        <thead>
            <tr>
                <th>이름</th>
                <th>나이</th>
                <th>주소</th>
                <th>취미</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td>이순신</td>
                <td>34</td>
                <td>통영시</td>
                <td>등산</td>
            </tr>
            <tr>
                <td>홍길동</td>
                <td>25</td>
                <td>서울시</td>
                <td>독서</td>
            </tr>
            <tr>
                <td>김철수</td>
                <td>28</td>
                <td>부산시</td>
                <td>운동</td>
            </tr>
            <tr>
                <td>신짱구</td>
                <td>10</td>
                <td>서울시</td>
                <td>게임</td>
            </tr>
            <tr>
                <td>문익점</td>
                <td>45</td>
                <td>광주시</td>
                <td>음악감상</td>
            </tr>
            <tr>
                <td>장영실</td>
                <td>50</td>
                <td>인천시</td>
                <td>요리</td>
            </tr>
            <tr>
                <td>장보고</td>
                <td>30</td>
                <td>부산시</td>
                <td>사냥</td>
            </tr>
            <tr>
                <td>이성계</td>
                <td>40</td>
                <td>전주시</td>
                <td>레고 조립하기</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
<script>
    let key = document.getElementById("keyword");

    key.addEventListener('keyup', function(){
        const rows = Array.from(document.querySelectorAll("#tableBody tr"));
        let value = this.value; // this는 key 객체를 가리킨다.
        
        // 입력한 텍스트가 포함된 tr(줄) 만 찾기
        const res = rows.filter( row =>
                row.textContent.toLowerCase().includes( value));

        // 테이블 전체 감추기
        rows.forEach( row => row.style.display = "none" );
        // 찾은 tr만 보이기
        res.forEach( row => row.style.display = "" );
    });
</script>
